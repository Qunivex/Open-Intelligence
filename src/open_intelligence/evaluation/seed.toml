# Seed golden set.
#
# This is a starting point to make the evaluation runnable, not the evaluation the project needs.
# The grades below were written by the AI assistant that built the ranking, from general knowledge
# of these fields and from what the searches returned on 2026-11-13/14. That is a conflict of
# interest and a small sample. Replace it with tasks and grades from practitioners who have not
# seen the ranking's output.
#
# Grades: 3 = the standard choice for the task, 2 = a good choice, 1 = usable with caveats
# (off-domain, a re-upload or conversion of a better option, tiny, unvetted), 0 = off-task, broken
# or not usable. Candidates with no grade count as 0 and are reported as unjudged.

[meta]
name = "seed"
judged_by = "the AI assistant that built the ranking (seed grades; needs practitioner review)"

# --- models ---------------------------------------------------------------------------------------

[[tasks]]
id = "sentiment-english-model"
need = "model"
task = "Classify the sentiment of English product reviews with a pretrained model"
queries = ["sentiment analysis", "review sentiment", "text classification"]
must_have = ["sentiment classification", "english"]
constraints = { languages = ["en"] }

[tasks.judgments]
"huggingface:nlptown/bert-base-multilingual-uncased-sentiment" = 3 # trained on product reviews
