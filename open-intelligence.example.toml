# Open Intelligence config (optional).
#
# Without a config file, Open Intelligence connects to the three official remote MCP servers with the
# settings below. Copy this file to ./open-intelligence.toml or ~/.config/open-intelligence/config.toml
# (or point $OPEN_INTELLIGENCE_CONFIG / --config at it) only to change something.
#
# Tokens NEVER go in this file. token_env lists the NAMES of environment variables; a token pasted
# there is refused. Put the token itself in the environment, or in a git-ignored .env file next to
# where you run (or in ~/.config/open-intelligence/.env) as a line like:
#   GITHUB_PERSONAL_ACCESS_TOKEN=github_pat_...

[gateway]
timeout_seconds = 45        # per source, per request
max_result_chars = 12000    # cap on the text returned from one upstream tool call

[ranking]
per_query = 10          # results asked of a source per search phrasing
max_queries = 3         # phrasings used per need
read_per_source = 8     # candidates per need and source whose README or card is read
min_fit = 0.3           # below this fit a candidate is not offered at all

# How much each part of the score counts. Normalized to sum to 1. A first hypothesis, not tuned values.
[ranking.weights]
fit = 0.40
quality = 0.20
health = 0.15
trust = 0.15
adoption = 0.10

# Months after which freshness halves.
[ranking.half_life_months]
code = 18
model = 30
dataset = 60
notebook = 30

# Security evidence for repositories. These two are public HTTPS APIs, not MCP servers. Only the
# repository and package names of candidates are sent to them.
[evidence]
scorecard = true                             # OpenSSF Scorecard
advisories = true                            # known vulnerabilities in the current release, through deps.dev
scorecard_url = "https://api.scorecard.dev"
deps_dev_url = "https://api.deps.dev"
timeout_seconds = 20

[sources.github]
enabled = true
transport = "http"
url = "https://api.githubcopilot.com/mcp/"
headers = { "X-MCP-Readonly" = "true", "X-MCP-Toolsets" = "repos,security_advisories" }
token_env = ["GITHUB_PERSONAL_ACCESS_TOKEN", "GITHUB_TOKEN"]   # required

# Or run GitHub's official server locally in Docker instead of the hosted one:
# transport = "stdio"
# command = "docker"
# args = ["run", "-i", "--rm", "-e", "GITHUB_PERSONAL_ACCESS_TOKEN",
#         "-e", "GITHUB_READ_ONLY=1", "-e", "GITHUB_TOOLSETS=repos,security_advisories",
#         "ghcr.io/github/github-mcp-server"]

[sources.huggingface]
enabled = true
transport = "http"
url = "https://huggingface.co/mcp"
token_env = ["HF_TOKEN", "HUGGING_FACE_HUB_TOKEN"]   # optional: anonymous works

[sources.kaggle]
enabled = true
transport = "http"
url = "https://www.kaggle.com/mcp"
token_env = ["KAGGLE_API_TOKEN"]   # optional for dataset/model search; needed for notebook and competition search
